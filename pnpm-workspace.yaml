packages:
  # The landing-page video (Remotion); kept out of the site bundle.
  - video

autoInstallPeers: false

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  electron-to-chromium: 1.5.406
  # One sharp for the logo code and Next: 0.35.4 carries a librsvg flaw reachable through SVG logos.
  sharp: 0.35.5
  # postcss pulls 1.2.1, which a crafted source map can stall (build time only).
  source-map-js: 1.2.2
  # Only reached through the video workspace (Remotion), never the site; patched anyway.
  fast-uri@3: 3.1.9
  js-yaml@4: 4.3.2
  postcss-selector-parser@7: 7.1.6
  # Transitive fixes for audit findings (dev tooling: shadcn CLI, eslint; zod is reached through better-auth).
  zod@4: 4.6.7
  undici@7: 7.30.1
  systeminformation: 5.33.16
  brace-expansion@1: 1.1.21
  brace-expansion@5: 5.0.12
  "@modelcontextprotocol/sdk": 1.32.0
  hono: 4.13.11
  "@hono/node-server": 2.1.3
  ip-address: 10.7.4
  qs@6: 6.16.1
  body-parser@2: 2.4.0
  proxy-addr: 2.0.8
  minimatch@10: 11.0.1

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.18'
  - '@better-auth/drizzle-adapter@1.7.18'
  - '@better-auth/kysely-adapter@1.7.18'
  - '@better-auth/memory-adapter@1.7.18'
  - '@better-auth/mongo-adapter@1.7.18'
  - '@better-auth/prisma-adapter@1.7.18'
  - '@better-auth/telemetry@1.7.18'
  - better-auth@1.7.18
