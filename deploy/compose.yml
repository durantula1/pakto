# Everything that runs on the server (/opt/pakto/deploy). Only Caddy publishes ports (80, 443); the database and
# the app are reachable from inside this Compose network only.
#   docker compose --env-file ../.env up -d                      start / update
#   docker compose --env-file ../.env --profile tools run --rm migrate    apply db/migrations/
name: deploy

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: pakto_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set in .env}
      POSTGRES_DB: pakto
      PAKTO_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set in .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakto_owner -d pakto"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    profiles: ["tools"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://pakto_owner:${POSTGRES_OWNER_PASSWORD}@postgres:5432/pakto?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ../db:/db:ro
    command: ["--wait", "up"]

  app:
    image: pakto-app:${APP_TAG:-local}
    build:
      context: ../src
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://pakto.net}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      TZ: Europe/Sofia
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://pakto.net}
      DATABASE_URL: postgres://pakto_app:${POSTGRES_APP_PASSWORD}@postgres:5432/pakto
      DATABASE_SSL: "false"
      FILES_DIR: /data/files
      PORTAL_LINK_SECRET: ${PORTAL_LINK_SECRET:?set in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env}
      CRON_SECRET: ${CRON_SECRET:?set in .env}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-info@pakto.net}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set in .env}
      EMAIL_FROM: ${EMAIL_FROM:-Pakto <info@pakto.net>}
      EMAIL_DAILY_LIMIT: ${EMAIL_DAILY_LIMIT:-1000}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-info@pakto.net}
    volumes:
      - files:/data/files
    # after() sends the last emails of a request: give them time to finish on a restart.
    stop_grace_period: 30s
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

  # Calls the cron endpoints of the app (Europe/Sofia): email retries every minute, account purge at 03:00, reminders at 07:00.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    environment:
      TZ: Europe/Sofia
      CRON_SECRET: ${CRON_SECRET}
      APP_URL: http://app:3000
    volumes:
      - ./cron/loop.sh:/loop.sh:ro
    command: ["sh", "-c", "apk add --no-cache curl tzdata >/dev/null && exec sh /loop.sh"]
    logging: *logging

  # Nightly copy of the database and the files to /opt/pakto/backups, 14 days kept. Off-site copy: see docs.
  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      TZ: UTC
      PGHOST: postgres
      PGUSER: pakto_owner
      PGPASSWORD: ${POSTGRES_OWNER_PASSWORD}
      PGDATABASE: pakto
    volumes:
      - ./backup/run.sh:/run.sh:ro
      - files:/data/files:ro
      - ../backups:/backups
    command: ["bash", "/run.sh"]
    logging: *logging

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
