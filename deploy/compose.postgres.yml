# Postgres 17 and the migration job. The database has no published port: only containers on this
# Compose network (and `docker compose exec`) can reach it.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: pakto_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set in .env}
      POSTGRES_DB: pakto
      PAKTO_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set in .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakto_owner -d pakto"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # `docker compose run --rm migrate` applies db/migrations/ (dbmate) before a new app version starts.
  migrate:
    image: ghcr.io/amacneil/dbmate:2
    profiles: ["tools"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://pakto_owner:${POSTGRES_OWNER_PASSWORD}@postgres:5432/pakto?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ../db:/db:ro
    command: ["--wait", "up"]

volumes:
  pgdata:
