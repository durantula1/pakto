# Every push to main: checks and the build run side by side (`next build` on the runner, then Dockerfile.prebuilt
# only copies the result); the image goes to GHCR, and the VPS gets it
# (deploy/deploy.sh over SSH) only after both pass. A push that changes only docs or Markdown deploys nothing.
# Needs one secret: DEPLOY_SSH_KEY (private key whose public half is in the server's authorized_keys with a forced command).
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/durantula1/pakto
  # The VPS by its IP: pakto.net goes through the Cloudflare proxy, which carries only HTTP(S), not SSH.
  SERVER: deploy@187.7.64.36
  SERVER_HOST_KEY: 187.7.64.36 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGHJIwZYI6Jfr8kTwSMUeozh66oNoZ7r5igUGBZyPVPK

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter pakto
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter pakto
      # Next's own build cache: a push that changes a few files compiles only those.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      # `next build` loads server modules to collect page data; nothing connects or signs anything at build time.
      - run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: https://pakto.net
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: postgres://build:build@localhost:5432/build
          BETTER_AUTH_SECRET: build-only-placeholder-not-used-at-runtime-0000
          PORTAL_LINK_SECRET: build-only-placeholder-not-used-at-runtime-0000
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prebuilt
          push: true
          labels: org.opencontainers.image.source=https://github.com/durantula1/pakto
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
            db
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SERVER_HOST_KEY" > ~/.ssh/known_hosts
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s' "$REGISTRY_TOKEN" > .deploy-token
          tar czf - deploy db .deploy-token | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=20 "$SERVER" "${{ github.sha }}"
