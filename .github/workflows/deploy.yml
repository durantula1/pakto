# Every push to main: check, build the image, push it to GHCR, deploy it to the VPS (deploy/deploy.sh over SSH).
# Needs one secret: DEPLOY_SSH_KEY (private key whose public half is in the server's authorized_keys with a forced command).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/durantula1/pakto
  SERVER: deploy@pakto.net
  SERVER_HOST_KEY: pakto.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGHJIwZYI6Jfr8kTwSMUeozh66oNoZ7r5igUGBZyPVPK

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter pakto
      - run: pnpm typecheck
      - run: pnpm lint

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: NEXT_PUBLIC_APP_URL=https://pakto.net
          labels: org.opencontainers.image.source=https://github.com/durantula1/pakto
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SERVER_HOST_KEY" > ~/.ssh/known_hosts
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s' "$REGISTRY_TOKEN" > .deploy-token
          tar czf - deploy db .deploy-token | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SERVER" "${{ github.sha }}"
